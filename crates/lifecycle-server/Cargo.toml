[package]
name = "hodei-mh-lifecycle-server"
description = "Rust control plane implementing the OpenSandbox lifecycle API subset used by hodei-meta-harness (Docker backend)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lifecycle_server"

[[bin]]
name = "hodei-mh-lifecycle-server"
path = "src/main.rs"

[dependencies]
budget = { path = "../hodei-mh-budget", package = "hodei-mh-budget" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bollard = { workspace = true }
axum = { workspace = true }
tar = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
subtle = "2.6.1"
sha2 = { workspace = true }

[dev-dependencies]
# `tower::ServiceExt::oneshot` calls the router in process: the HTTP
# surface is exercised offline, with no daemon and no sleep.
tower = { workspace = true }
