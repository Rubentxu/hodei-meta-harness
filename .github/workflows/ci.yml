name: CI

# The workspace gate runs on every push and pull request. The expensive
# lane (the four probes against real Docker and the lifecycle server) runs
# on main and on demand: it starts sandboxes and builds real images, and
# paying for it on every pull request buys nothing the main run does not
# catch before a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: workspace gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge base is needed to know what a pull request changes.
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache the registry and the build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fast-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fast-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Doctests
        run: cargo test --workspace --doc --locked

  integration:
    name: probe lane
    # The expensive lane is not part of every pull request: it runs on main
    # and on demand, so a broken sandbox is caught before a release without
    # charging every review.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache the registry and the build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: integration-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: integration-${{ runner.os }}-

      - name: Docker is available
        run: docker version --format '{{.Server.Version}}'

      - name: Run the probes
        run: scripts/probes.sh --rounds 1
